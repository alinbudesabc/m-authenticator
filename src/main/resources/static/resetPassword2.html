<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password</title>
    <link rel="stylesheet" href="/style/style.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: #f0f2f5;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        /*.error-alert {*/
        /*    color: red;*/
        /*    margin-top: 0.5rem;*/
        /*    display: none;*/
        /*    text-align: center;*/
        /*}*/

        /*added in js script*/
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-bottom: 2px solid #c3e6cb;
        }

        /*added in js script*/
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border-bottom: 2px solid #f5c6cb;
        }

        #successMessage {
            color: green;
            text-align: center;
            display: none;
            margin-top: 1rem;
        }

        .form-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            font-family: sans-serif;
            background-color: #f9f9f9;
            border-radius: 8px;
        }

        .title-bar {
            text-align: center;
            margin-bottom: 20px;
        }

        .password-wrapper {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            position: relative;
        }

        .password-wrapper label {
            margin-bottom: 5px;
        }

        .password-wrapper input {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        .password-wrapper .toggle-password {
            position: absolute;
            right: 10px;
            top: 38px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        /*.error-alert {*/
        /*    color: red;*/
        /*    margin-bottom: 15px;*/
        /*}*/

        .buttons {
            text-align: center;
        }

        .buttons button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .alert-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            text-align: center;
            z-index: 9999;
            font-weight: bold;
            font-size: 1rem;
        }

        #formBanner {
            color: red;
            text-align: center;
            min-height: 1.5em; /* Reserve vertical space */
            visibility: hidden; /* Keep space but hide the content */
            margin-top: 0.5rem;
        }

    </style>
</head>
<body>
<div id="alertBanner" class="alert-banner" style="display: none;"></div>
<div class="form-container">
        <h1 class="title-bar">Reset Password</h1>

        <div class="password-wrapper">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="confirmPassword" required>
<!--            <button type="button" class="toggle-password">👁️</button>-->
        </div>

        <div class="password-wrapper">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required />
            <button type="button" class="toggle-password">👁️</button>
        </div>

        <div id="formBanner">error</div>

        <div class="buttons">
            <button id="submitButton">Submit</button>
        </div>
</div>

<!--<p id="successMessage" style="display: none; color: green;">Password reset successful!</p>-->


<script>
    $(document).ready(function () {
        $('.toggle-password').on('click', function () {
            const field = $('#confirmPassword');
            const type = field.attr('type') === 'password' ? 'text' : 'password';
            field.attr('type', type);
            $(this).text(type === 'password' ? '👁️' : '🙈');
        });

        $('#submitButton').click(function () {
            if (checkPasswordsMatch()) {
                savePassword();
            }
        });

        $('#newPassword, #confirmPassword').on('keyup', checkPasswordsMatch);
    });

    function checkPasswordsMatch() {
        const newPassword = $('#newPassword').val();
        const confirmPassword = $('#confirmPassword').val();

        if (newPassword === confirmPassword && newPassword.length > 0) {
            $('#formBanner').css('visibility', 'hidden').text('');
            return true;
        } else {
            $('#formBanner').text("Passwords don't match").css('visibility', 'visible');
            return false;
        }
    }

    function savePassword() {
        $('#submitButton').prop('disabled', true);
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");
        const newPassword = $('#newPassword').val();

        $.ajax({
            type: "POST",
            url: "/resetPassword",
            contentType: "application/json",
            data: JSON.stringify({ newPassword: newPassword, token: token }),
            success: function (response) {
                // $('#successMessage').show().text("Success, redirecting to login... : ");
                const alertBanner = document.getElementById("alertBanner");
                alertBanner.textContent = "Success, redirecting to login....";
                alertBanner.className = "alert-banner alert-success";
                alertBanner.style.display = "block";
                setTimeout(() => {
                    window.location.href = "/login2.html?message=passResetOK";
                }, 12000);
            },
            error: function (xhr, status, error) {
                let errorMessage = "An error occurred while resetting the password.";
                try {
                    const responseJson = JSON.parse(xhr.responseText);
                    if (responseJson.message) {
                        errorMessage = responseJson.message;
                    }
                } catch (e) {
                    console.warn("Failed to parse error response:", e);
                }
                // $('#globalError').show().text("Error resetting password: " + errorMessage);
                const alertBanner = document.getElementById("alertBanner");
                alertBanner.textContent = "Error resetting password: " + errorMessage;
                alertBanner.className = "alert-banner alert-error";
                alertBanner.style.display = "block";
                $('#submitButton').prop('disabled', false);
            }
        });
    }
</script>
</body>
</html>
