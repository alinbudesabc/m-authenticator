<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (Optional, for icons) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .profile-badge {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #212529;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 50px;
            padding: 5px 10px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .profile-badge img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .profile-badge:hover {
            background-color: #e9ecef;
            text-decoration: none;
        }
        .sidebar {
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            background-color: #343a40;
            padding-top: 60px;
        }
        .sidebar a {
            color: #fff;
            padding: 15px;
            text-decoration: none;
            display: block;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            margin-left: 250px;
            padding: 20px;
        }
    </style>
</head>
<body>
<!-- Header -->
<header class="bg-light shadow-sm fixed-top py-2">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="fs-4 mb-0">Dashboard</h1>
        <a href="#profile" class="profile-badge">
            <img src="https://via.placeholder.com/30" alt="User Profile">
            John Doe
        </a>
    </div>
</header>

<!-- Sidebar -->
<div class="sidebar">
    <a href="#dashboard" class="active"><i class="bi bi-house-door me-2"></i> Dashboard</a>
    <a href="#settings"><i class="bi bi-gear me-2"></i> Settings</a>
    <a href="#reports"><i class="bi bi-bar-chart me-2"></i> Reports</a>
    <a href="#help"><i class="bi bi-question-circle me-2"></i> Help</a>
</div>

<!-- Main Content -->
<div class="content">
    <div class="container-fluid">
        <div id="dashboard" class="mb-4">
            <h2>Welcome to the Dashboard</h2>
            <p>Here is an overview of your application.</p>
        </div>
        <div id="settings" class="mb-4">
            <h3>Settings</h3>
            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Change Password</label>
                    <input type="password" class="form-control" id="password" placeholder="New Password">
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
        <div id="reports" class="mb-4">
            <h3>Reports</h3>
            <p>Generate and view reports here.</p>
        </div>
        <div id="help" class="mb-4">
            <h3>Help</h3>
            <p>Need assistance? Contact support or check the FAQs.</p>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
