<body>

    <div>
        <h1> Reset Password</h1>
            <input id="tokenInput" type="hidden" name="token" th:value="${token}">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="newPassword" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
            <button type="button" class="toggle-password">👁️</button>
            <div id="globalError" class="error-alert" style="display:none">error</div>
<!--            <div id="tokenId" class="custom-alert" th:text="${token}"></div>-->

<!--            <button id="submitButton" type="submit">Submit</button>-->
<!--        </form>-->
    </div>
<div>
    <button id="submitButton">Submit</button>
</div>


<script type="application/javascript" th:inline="javascript">
    $(document).ready(function () {
        $(".toggle-password").on("click", function () {
            const passwordField = $("#confirmPassword");

            // Toggle the password field type
            if (passwordField.attr("type") === "password") {
                passwordField.attr("type", "text");
                $(this).text("🙈");
            } else {
                passwordField.attr("type", "password");
                $(this).text("👁️");
            }
        });

        // Listen for the submit button click
        $('#submitButton').click(function (event) {
            // Validate passwords match before sending request
            let token = /*[[${token}]]*/ '';
            debugger;
            const token2 = $('#token').val();
            console.log('token2')
            console.log(token2)
            if (checkPasswordsMatch()) {
                savePassword();
            }
        });

        // Real-time password matching feedback
        $('#newPassword, #confirmPassword').on('keyup', function () {
            checkPasswordsMatch();
        });
    });

    // Function to check if passwords match
    function checkPasswordsMatch() {
        const newPassword = $('#newPassword').val();
        const confirmPassword = $('#confirmPassword').val();

        if (newPassword === confirmPassword) {
            $('#globalError').hide();
            return true; // Passwords match
        } else {
            $('#globalError').show().text("Passwords don't match");
            return false; // Passwords do not match
        }
    }

    // Function to send new password and token to the controller
    function savePassword() {
        const newPassword = $('#newPassword').val();
        const tokenQ = $('#tokenInput').val();

        console.log('Token2:');
        console.log(tokenQ)

        console.log("New Password:", newPassword);
        console.log("Token:", tokenQ);


        $.ajax({
            type: "POST",
            url: "/resetPassword",
            contentType: "application/json",
            data: JSON.stringify({ newPassword: newPassword, token: tokenQ }),
            success: function (response) {
                // alert("Password reset successful!"); // Handle success response
                    $('#successMessage').fadeIn();
                    setTimeout(function() {
                        $('#successMessage').fadeOut();
                    }, 5000);
                window.location.href = "/login?message=validToken";
            },
            error: function (xhr, status, error) {
                alert("Error resetting password: " + error); // Handle error response
            }
        });
    }
</script>
