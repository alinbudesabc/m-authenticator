<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 50px auto;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4caf50;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>
<div class="container profile-container">
    <h2 class="text-center">Account Profile</h2>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title" th:text="${username}"></h5>
            <p class="card-text"><strong>Email:</strong>  <span id="email" th:text="${username}"></span><</p>
            <p style="display: none;"> <span id="username" th:text="${username}"></span></p>

            <div class="mt-4">
                <label for="twoFactorSwitch" class="form-label">
                    <strong>Enable Two-Factor Authentication</strong>
                </label>
                <label class="switch">
                    <input type="checkbox" id="twoFactorSwitch">
                    <span class="slider"></span>
                </label>
            </div>
            <div id="qrCodeSection" class="mt-4 d-none">
                <h6>Scan the QR Code in Google Authenticator</h6>
                <div id="qrCode">
                    <img id="qrImage" alt="QR Code" />
                </div>

                <p class="text-muted">Enter the 6-digit code from Google Authenticator to verify.</p>
            </div>
        </div>
    </div>
</div>


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function () {
        $('#twoFactorSwitch').change(function () {
            if ($(this).is(':checked')) {
                // 2FA Enabled
                alert("Two-Factor Authentication Enabled");
                $('#qrCodeSection').removeClass('d-none');
                generateQRCode();
            } else {
                // 2FA Disabled
                alert("Two-Factor Authentication Disabled");
                $('#qrCodeSection').addClass('d-none');
            }
        });


        function generateQRCode() {
            $.ajax({
                type : "GET",
                url : "/2fa/qrcode/get?username=" + $('#username'),
                contentType: 'application/json',
                success : function(msg) {
                    alert("success");

                    $('#qrImage').attr('src', 'data:image/png;base64,' + msg);
                },
                error : function() {
                    alert("failure");
                }
            });
        }
    });
</script>
</body>
</html>
